name: publish-hotfix

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish the hotfix from, typically a branch cut from the current stable tag.
        required: true
      version:
        description: Stable patch version to publish, for example 0.69.4
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-hotfix
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Fetch hotfix ref
        run: git fetch origin '${{ inputs.ref }}'
      - name: Prepare candidate worktree
        run: |
          set -eu
          candidate_dir="$RUNNER_TEMP/hotfix-candidate"
          git worktree add --detach "$candidate_dir" '${{ inputs.ref }}'
      - name: Verify Rin changelog entry
        working-directory: ${{ runner.temp }}/hotfix-candidate
        run: |
          set -eu
          from_ref=$(node -e 'const manifest = require("./release-manifest.json"); process.stdout.write(String(manifest.stable?.ref || ""));')
          npx --yes tsx scripts/release/verify-changelog.ts \
            --version '${{ inputs.version }}' \
            --from-ref "$from_ref" \
            --to-ref '${{ inputs.ref }}'
      - name: Install candidate dependencies
        working-directory: ${{ runner.temp }}/hotfix-candidate
        run: npm ci --no-fund --no-audit
      - name: Build candidate
        working-directory: ${{ runner.temp }}/hotfix-candidate
        run: npm run build
      - name: Build isolated system-test image
        working-directory: ${{ runner.temp }}/hotfix-candidate
        run: docker build -f .ci/local-ci/Dockerfile -t rin-local-ci:latest .
      - name: Validate candidate
        working-directory: ${{ runner.temp }}/hotfix-candidate
        run: npm run test:release
      - name: Set hotfix version on candidate
        working-directory: ${{ runner.temp }}/hotfix-candidate
        run: npm version --no-git-tag-version '${{ inputs.version }}'
      - name: Build hotfix linux-x64 platform bundle
        id: bundle_linux_x64
        working-directory: ${{ runner.temp }}/hotfix-candidate
        run: |
          set -eu
          node_runtime=$(node -p "require('node:path').dirname(require('node:path').dirname(process.execPath))")
          bundle_dir="$RUNNER_TEMP/rin-bundles"
          bundle_json="$RUNNER_TEMP/rin-linux-x64-bundle.json"
          mkdir -p "$bundle_dir"
          npm run --silent release:bundle -- \
            --output "$bundle_dir" \
            --platform linux-x64 \
            --node-runtime "$node_runtime" \
            --node-version "$(node -p 'process.versions.node')" \
            > "$bundle_json"
          bundle_path=$(node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(p.bundlePath)' "$bundle_json")
          bundle_name=$(basename "$bundle_path")
          echo "path=$bundle_path" >> "$GITHUB_OUTPUT"
          echo "name=$bundle_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(p.sha256)' "$bundle_json")" >> "$GITHUB_OUTPUT"
          echo "node_version=$(node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(p.nodeVersion)' "$bundle_json")" >> "$GITHUB_OUTPUT"
      - name: Publish hotfix package
        working-directory: ${{ runner.temp }}/hotfix-candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag latest --access public
      - name: Publish hotfix platform bundle asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag='v${{ inputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "Rin $tag" '${{ inputs.ref }}'
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target '${{ inputs.ref }}' \
              --title "Rin $tag" \
              --notes "Rin $tag platform bundles"
          fi
          gh release upload "$tag" '${{ steps.bundle_linux_x64.outputs.path }}' --clobber
      - name: Update release manifest
        run: >-
          npx --yes tsx scripts/release/update-release-manifest.ts
          --channel stable
          --version '${{ inputs.version }}'
          --ref '${{ inputs.ref }}'
          --asset-platform linux-x64
          --asset-url 'https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/${{ steps.bundle_linux_x64.outputs.name }}'
          --asset-sha256 '${{ steps.bundle_linux_x64.outputs.sha256 }}'
          --asset-node-version '${{ steps.bundle_linux_x64.outputs.node_version }}'
      - name: Commit hotfix metadata and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-manifest.json
          git commit -m 'chore(release): publish hotfix ${{ inputs.version }}' || true
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Prepare bootstrap branch checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          bootstrap_branch=bootstrap
          bootstrap_dir="$RUNNER_TEMP/$bootstrap_branch"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin "$bootstrap_branch" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$bootstrap_branch" "$remote_url" "$bootstrap_dir"
          else
            git init "$bootstrap_dir"
            git -C "$bootstrap_dir" checkout --orphan "$bootstrap_branch"
            git -C "$bootstrap_dir" remote add origin "$remote_url"
          fi
          npx --yes tsx scripts/release/export-bootstrap-branch.ts --output "$bootstrap_dir" --branch "$bootstrap_branch"
          git -C "$bootstrap_dir" config user.name 'github-actions[bot]'
          git -C "$bootstrap_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$bootstrap_dir" add .
          if git -C "$bootstrap_dir" diff --cached --quiet; then
            echo 'No bootstrap changes to commit.'
          else
            git -C "$bootstrap_dir" commit -m 'chore(release): publish hotfix ${{ inputs.version }}'
            if ! git -C "$bootstrap_dir" push origin "HEAD:$bootstrap_branch"; then
              git -C "$bootstrap_dir" fetch origin "$bootstrap_branch"
              git -C "$bootstrap_dir" rebase "origin/$bootstrap_branch"
              git -C "$bootstrap_dir" push origin "HEAD:$bootstrap_branch"
            fi
          fi
      - name: Remove candidate worktree
        if: always()
        run: git worktree remove --force "$RUNNER_TEMP/hotfix-candidate" || true
